# Module 4 — Variables (vars), Encrypted Secrets (secrets) and GITHUB_TOKEN
# Setup first: Settings -> Secrets and variables -> Actions
#   Variables tab : MY_VAR    = Hello from repository variable
#   Secrets tab   : MY_SECRET = (any demo value)
name: "M4 - Variables, Secrets & GITHUB_TOKEN"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  actions: read

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configuration variable (vars context — NOT masked)
        run: |
          echo "MY_VAR = ${{ vars.MY_VAR }}"

      - name: Encrypted secret (secrets context — masked as ***)
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}
        run: |
          echo "Trying to print the secret: $MY_SECRET"
          if [ -n "$MY_SECRET" ]; then
            echo "Secret is set. Length = ${#MY_SECRET} characters"
          else
            echo "MY_SECRET is not configured yet"
          fi

      - name: REST API call authenticated with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Token value in logs: ${{ secrets.GITHUB_TOKEN }}"
          echo "--- Repo info via REST API ---"
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               https://api.github.com/repos/${{ github.repository }} \
            | jq '{full_name, visibility, default_branch, stargazers_count}'
          echo "--- Latest workflow runs via gh CLI ---"
          gh api repos/${{ github.repository }}/actions/runs --jq '.workflow_runs[:5][] | "\(.name) | \(.event) | \(.conclusion)"'

      - name: git operation authenticated with GITHUB_TOKEN
        run: |
          git ls-remote "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" | head -5
