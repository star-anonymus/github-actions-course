# Module 2D — Webhook Events (repository_dispatch)
# Trigger externally with a Personal Access Token (PAT, repo scope / "Contents: write"):
#
#   curl -i -X POST \
#     -H "Accept: application/vnd.github+json" \
#     -H "Authorization: Bearer <YOUR_PAT>" \
#     -H "X-GitHub-Api-Version: 2022-11-28" \
#     https://api.github.com/repos/star-anonymus/github-actions-course/dispatches \
#     -d '{"event_type":"custom-webhook","client_payload":{"message":"Hello from curl","unit":false}}'
#
# A successful call returns: HTTP/2 204 (No Content)
name: "M2D - repository_dispatch Webhook"

on:
  repository_dispatch:
    types: [custom-webhook]

jobs:
  webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Show webhook payload
        run: |
          echo "Event       : ${{ github.event_name }}"
          echo "Action/type : ${{ github.event.action }}"
          echo "Message     : ${{ github.event.client_payload.message }}"
          echo "Full payload: ${{ toJSON(github.event.client_payload) }}"
